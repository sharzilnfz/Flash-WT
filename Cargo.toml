[workspace]
resolver = "2"
members = ["crates/wt-copy", "crates/wt-store", "crates/wt-cli"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Instant git worktrees with heavy directories already hydrated"
repository = "https://github.com/sharzilnfz/wt"
readme = "README.md"
rust-version = "1.85"

[workspace.dependencies]
libc = "0.2"
tempfile = "3"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"

[profile.release]
lto = true
strip = true

[profile.test]
debug = 1
split-debuginfo = "unpacked"

