name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - run: cargo test --locked

  clippy-macos:
    # cfg(macos) code (clonefile, bulkwalk externs) is invisible to the
    # Linux validate job, so lint it on a macOS runner too.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --locked -- -D warnings

  validate:
    # Linux validation: formatting, lints, and the test suite on one
    # runner. macOS-only tests skip themselves via #[cfg(target_os =
    # "macos")] gates (crates/wt-cli/tests/snapshots.rs,
    # crates/wt-cli/tests/snapshots_v2.rs, crates/wt-store/tests/bulkwalk.rs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  smoke-installers:
    strategy:
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Homebrew is preinstalled on GitHub's macOS runners and available on
      # their Ubuntu images, so both install paths get coverage.
      - run: ./scripts/smoke-install.sh
