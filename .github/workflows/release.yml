name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FLASHFLASHWT_REPO: sharzilnfz/Flash-WT

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_IDENTITY: ${{ secrets.MACOS_IDENTITY }}
        run: |
          BIN="target/${{ matrix.target }}/release/flashwt"
          if [ -n "$MACOS_CERTIFICATE" ]; then
            echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
            KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
            security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security default-keychain -s "$KEYCHAIN"
            security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
            codesign --force --options runtime --timestamp --sign "$MACOS_IDENTITY" "$BIN"
            rm -f cert.p12
          else
            codesign --force --sign - "$BIN"
          fi
      - name: Package
        run: |
          DIR="flashwt-v${VERSION}-${{ matrix.target }}"
          mkdir "$DIR"
          cp "target/${{ matrix.target }}/release/flashwt" "$DIR/"
          ln -s flashwt "$DIR/flash-flashwt"
                    cp README.md "$DIR/"
          for shell in bash zsh fish; do
            "target/${{ matrix.target }}/release/flashwt" completions "$shell" >"$DIR/flashwt.$shell"
          done
          tar czf "${DIR}.tar.gz" "$DIR"
          shasum -a 256 "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            flashwt-v${{ env.VERSION }}-*.tar.gz
            flashwt-v${{ env.VERSION }}-*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate brew formula with real checksums
        run: |
          mkdir -p Formula-generated
          ./scripts/gen-formula.sh "$VERSION" dist > Formula-generated/flashwt.rb
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Formula-generated/flashwt.rb dist/flashwt.rb
          gh release create "v$VERSION" \
            --repo "$FLASHWT_REPO" \
            --title "v$VERSION" \
            --generate-notes \
            dist/*.tar.gz dist/*.tar.gz.sha256 dist/flashwt.rb

